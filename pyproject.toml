[project]
name = "clean-stem"
version = "0.1.0"
description = "Censor profanity in a music library by replacing vocals with AI-separated instrumentals"
authors = [
    { name = "Matthew Carlson", email = "matthewfcarlson@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.1",
]

[project.scripts]
clean-stem = "clean_stem.cli:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
